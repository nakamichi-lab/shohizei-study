<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172c4b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="消費税Study"><title>消費税Study | 試作品</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#16263b;background:#eef3f8}*{box-sizing:border-box}body{margin:0}.app{max-width:570px;margin:auto;min-height:100dvh;background:#f8fafd;padding-bottom:93px}.top{background:#172c4b;color:white;padding:24px 22px 27px;border-radius:0 0 24px 24px}.eyebrow{font-size:12px;opacity:.75;letter-spacing:.06em}.top h1{margin:9px 0;font-size:26px}.top p{font-size:13px;color:#cddbea;margin:0}.main{padding:20px}.card{background:white;border:1px solid #e1e8f0;box-shadow:0 3px 16px #14243b08;padding:18px;border-radius:17px;margin:0 0 13px}.card h2{font-size:17px;margin:0 0 12px}.meta{font-size:12px;color:#6d798c}.big{font-size:30px;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{border:1px solid #dfe6f0;background:white;border-radius:15px;padding:17px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:108px}.tile strong{display:block;font-size:16px;margin:9px 0 5px}.tile small{color:#718093}.emoji{font-size:23px}.bar{height:9px;border-radius:10px;background:#e6ecf4;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#2b78c6;border-radius:10px}.btn{border:0;border-radius:11px;padding:13px 17px;background:#2269b6;color:white;font-weight:700;font-size:14px;cursor:pointer}.btn.secondary{background:#eaf0f7;color:#264464}.btn.danger{background:#fff0f0;color:#9c3535}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.full{width:100%}.choice{display:block;width:100%;border:1px solid #dbe4ee;background:white;border-radius:12px;text-align:left;padding:14px;margin:9px 0;font:inherit;cursor:pointer;color:#253449}.choice.selected{border:2px solid #2974be;background:#f1f7fe}.choice:disabled{cursor:default}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf2fc;color:#275f9d;font-size:12px;font-weight:700}.muted{color:#68778c}.hint{font-size:12px;background:#f1f5fa;border-radius:9px;padding:10px;line-height:1.6}.answer{margin-top:15px;padding:14px;background:#edf7f0;border-radius:12px;line-height:1.8;font-size:14px}.answer.wrong{background:#fff4ef}.field{width:100%;padding:13px;border:1px solid #cbd7e6;border-radius:10px;font:inherit;font-size:17px;margin:10px 0}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:570px;width:100%;display:flex;justify-content:space-around;border-top:1px solid #e0e7f0;background:white;padding:9px 5px calc(11px + env(safe-area-inset-bottom));z-index:2}.tab{background:none;border:0;color:#79869a;cursor:pointer;font-size:11px;width:24%;line-height:1.8}.tab.active{color:#145fa8;font-weight:800}.tab span{display:block;font-size:22px}.stat{background:white;border-radius:14px;padding:15px;border:1px solid #e0e7ef}.stat strong{font-size:24px;display:block;margin:5px 0}.list{display:flex;flex-direction:column;gap:9px}.item{padding:13px;border:1px solid #e4e9f0;border-radius:12px;background:white}.item small{color:#768399}.stack{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.stack .btn{padding:10px 12px}.hidden{display:none}.error{color:#a4333c;font-size:12px}.ok{color:#1c8155;font-size:12px}a{color:#2166ab;overflow-wrap:anywhere}details{margin-top:10px}summary{cursor:pointer}footer{font-size:11px;color:#7b8698;padding:8px 0 20px;line-height:1.6}
</style></head><body><div class="app"><header class="top"><div class="eyebrow">TAX ACCOUNTANT EXAM · PROTOTYPE</div><h1>消費税Study</h1><p>理論・計算・復習を、ひとつに。</p></header><main class="main" id="main"></main><nav class="tabs" aria-label="メインメニュー"><button class="tab active" data-page="home"><span>⌂</span>ホーム</button><button class="tab" data-page="theory"><span>▤</span>理論</button><button class="tab" data-page="calc"><span>▦</span>計算</button><button class="tab" data-page="records"><span>▥</span>記録・設定</button></nav></div><script>
'use strict';
const SOURCES={basic:'https://www.nta.go.jp/taxes/shiraberu/taxanswer/shohi/6101.htm',scope:'https://www.nta.go.jp/taxes/shiraberu/taxanswer/shohi/6105.htm',rate:'https://www.nta.go.jp/taxes/shiraberu/taxanswer/shohi/6303.htm',reduced:'https://www.nta.go.jp/taxes/shiraberu/taxanswer/shohi/6102.htm',calc:'https://www.nta.go.jp/taxes/shiraberu/taxanswer/shohi/6351.htm'};
const seed=[
{id:'t1',type:'theory',topic:'課税の対象',mode:'choice',q:'国内取引が消費税の課税対象となる基本的な要件の組合せとして、最も適切なものはどれか。なお、特定仕入れ等の特則は考慮しない。',choices:['国内・事業者・事業として・対価を得て・資産の譲渡等','国内・給与所得者・私生活上・無償・資産の譲渡','国外・事業者・事業として・対価を得て・資産の譲渡等'],correct:0,explain:'国内で事業者が事業として対価を得て行う資産の譲渡等が原則的な課税対象です。特定仕入れや輸入取引については別の規定があります。',source:SOURCES.scope},
{id:'t2',type:'theory',topic:'税率',mode:'choice',q:'2026年10月時点の標準税率（消費税・地方消費税合計）はどれか。',choices:['7.8％','8％','10％','12％'],correct:2,explain:'標準税率は合計10％で、国税7.8％と地方消費税2.2％から構成されます。',source:SOURCES.rate},
{id:'t3',type:'theory',topic:'軽減税率',mode:'choice',q:'2026年10月時点、軽減税率の対象となるものはどれか。いずれも国内での通常の販売とする。',choices:['飲食店内で提供する食事','酒類の販売','持ち帰り用に販売する一般的な飲食料品（酒類を除く）'],correct:2,explain:'軽減税率の対象は原則として酒類・外食を除く飲食料品等です。',source:SOURCES.reduced},
{id:'t4',type:'theory',topic:'仕入税額控除',mode:'blank',q:'課税売上げに係る消費税額から課税仕入れ等に係る消費税額を控除することを「＿＿＿＿」という。',correctText:'仕入税額控除',explain:'消費税の累積を避けるための仕組みです。インボイス制度下では原則として所定の帳簿・適格請求書等の保存が必要です。',source:SOURCES.basic},
{id:'t5',type:'theory',topic:'軽減税率',mode:'choice',q:'2026年10月時点の軽減税率（消費税・地方消費税合計）はどれか。',choices:['6.24％','8％','10％'],correct:1,explain:'軽減税率は合計8％で、国税6.24％と地方消費税1.76％です。',source:SOURCES.rate},
{id:'c1',type:'calc',topic:'税率計算',q:'税抜価格200,000円の標準税率10％対象商品の販売について、消費税・地方消費税の合計相当額はいくらか。',correctNumber:20000,formula:'200,000円 × 10％ = 20,000円',explain:'単一取引の税率計算練習です。申告上の端数処理・税額計算方法は考慮しません。',source:SOURCES.rate},
{id:'c2',type:'calc',topic:'税込価格',q:'税抜価格50,000円の軽減税率8％対象飲食料品について、税込価格はいくらか（2026年中の取引、値引き等なし）。',correctNumber:54000,formula:'50,000円 × 1.08 = 54,000円',explain:'単一取引の税率計算練習です。',source:SOURCES.reduced},
{id:'c3',type:'calc',topic:'複数税率',q:'税抜の標準税率対象売上100,000円と軽減税率対象売上50,000円について、両取引に係る消費税・地方消費税の合計相当額はいくらか（2026年中、端数なし）。',correctNumber:14000,formula:'100,000円 × 10％ + 50,000円 × 8％ = 14,000円',explain:'税率区分ごとの合計相当額を求める基礎練習です。申告上の売上税額の算出方法、端数処理等を再現した問題ではありません。',source:SOURCES.calc}
];
const KEY='shohizei_study_v1';const today=()=>new Date().toLocaleDateString('sv-SE');const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'{}');return v&&typeof v==='object'?v:{}}catch{return {}}}
let state=load();if(!Array.isArray(state.history))state.history=[];if(!state.review||typeof state.review!=='object')state.review={};if(!Array.isArray(state.custom))state.custom=[];if(!Number.isFinite(state.seconds))state.seconds=0;
let page='home',active=null,selection=null,finished=false,correct=false,sessionStarted=Date.now();const el=document.getElementById('main');
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('保存に失敗しました。容量・プライベートブラウズ設定等をご確認ください。')}}
function items(type){return seed.concat(state.custom).filter(q=>q.type===type)}
function due(q){return !state.review[q.id]||state.review[q.id].next<=today()}
function addDays(n){let d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')}
function nav(to){page=to;active=null;selection=null;finished=false;draw()}
function submitAnswer(){if(finished||!active)return;let q=active;let ans=selection;if(ans===null||String(ans).trim()==='')return;correct=q.mode==='choice'?Number(ans)===q.correct:q.mode==='blank'?String(ans).replace(/\s/g,'').trim()===q.correctText.replace(/\s/g,''):Number(String(ans).replace(/,/g,''))===q.correctNumber;finished=true;let r=state.review[q.id]||{streak:0};r.streak=correct?r.streak+1:0;r.next=addDays(correct?Math.min(30,[1,3,7,14,30][Math.min(r.streak-1,4)]):1);r.last=today();state.review[q.id]=r;state.history.push({id:q.id,date:new Date().toISOString(),correct,type:q.type,topic:q.topic});persist();draw()}
function choose(q){active=q;selection=null;finished=false;draw()}
function stats(){let h=state.history;return {count:h.length,correct:h.filter(v=>v.correct).length,done:new Set(h.map(v=>v.id)).size,need:seed.concat(state.custom).filter(due).length}}
function home(){let s=stats(),rate=s.count?Math.round(s.correct/s.count*100):0;return `<section class="card"><div class="row"><div><div class="meta">本日の学習</div><div class="big">${state.history.filter(x=>x.date.slice(0,10)===today()).length}<span class="muted" style="font-size:14px"> 問解答</span></div></div><span class="pill">2026年制度の基礎演習</span></div><div class="bar"><div style="width:${Math.min(100,state.history.filter(x=>x.date.slice(0,10)===today()).length/10*100)}%"></div></div><div class="meta">1日10問を目標にした目安</div></section><div class="grid"><button class="tile" onclick="nav('theory')"><span class="emoji">📖</span><strong>理論暗記</strong><small>選択・穴埋め</small></button><button class="tile" onclick="nav('calc')"><span class="emoji">🧮</span><strong>計算演習</strong><small>数値入力と解説</small></button><button class="tile" onclick="startDue()"><span class="emoji">🔁</span><strong>復習を始める</strong><small>対象 ${s.need} 問</small></button><button class="tile" onclick="nav('records')"><span class="emoji">📊</span><strong>学習記録</strong><small>正答率 ${rate}%</small></button></div><section class="card" style="margin-top:14px"><h2>この試作品について</h2><p class="muted" style="font-size:13px;line-height:1.8">問題は学習動作確認用の基礎例題です。税理士試験の出題範囲を網羅するものではありません。計算は取引単位の税率計算で、申告税額の計算を再現していません。</p></section>`}
function question(q){let input=q.mode==='choice'?q.choices.map((v,i)=>`<button class="choice ${selection===i?'selected':''}" ${finished?'disabled':''} onclick="setSel(${i})">${i+1}. ${safe(v)}</button>`).join(''):`<label for="ans" class="meta">${q.type==='calc'?'円単位の数値を入力（カンマ不要）':'空欄に入る語句を入力'}</label><input id="ans" class="field" ${finished?'disabled':''} value="${safe(selection??'')}" oninput="setText(this.value)" type="${q.type==='calc'?'number':'text'}" inputmode="${q.type==='calc'?'decimal':'text'}" placeholder="解答を入力">`;
return `<div class="row" style="margin-bottom:12px"><button class="btn secondary" onclick="nav('${q.type==='calc'?'calc':'theory'}')">← 一覧</button><span class="pill">${safe(q.topic)}</span></div><div class="card"><div class="meta">${q.type==='calc'?'計算演習':'理論暗記'} · ${safe(q.id)}</div><h2 style="font-size:18px;line-height:1.7;margin-top:9px">${safe(q.q)}</h2>${input}${finished?`<div class="answer ${correct?'':'wrong'}"><strong>${correct?'✓ 正解':'✕ 不正解'}</strong><div>正答：${safe(q.mode==='choice'?q.choices[q.correct]:q.mode==='blank'?q.correctText:q.correctNumber.toLocaleString('ja-JP')+'円')}</div>${q.formula?`<div>計算式：${safe(q.formula)}</div>`:''}<div>${safe(q.explain)}</div><a href="${safe(q.source)}" target="_blank" rel="noopener noreferrer">国税庁の参考資料 ↗</a></div><div class="stack"><button class="btn full" onclick="nextQuestion('${q.type}')">次の問題へ →</button></div><div class="hint">${correct?'正解した問題は段階的に復習間隔を延ばします。':'不正解の問題は翌日に復習対象となります。'}</div>`:`<button class="btn full" id="submit" ${selection===null||selection===''?'disabled':''} onclick="submitAnswer()">解答する</button>`}</div>`}
function listing(type){let a=items(type),all=state.history.filter(x=>x.type===type);return `<div class="row" style="margin-bottom:13px"><h2 style="margin:0">${type==='calc'?'計算演習':'理論暗記'}</h2><span class="pill">${a.length} 問</span></div><div class="card"><p class="muted" style="font-size:13px;line-height:1.7">${type==='calc'?'税額の基礎計算を練習します。申告実務の端数処理等は対象外です。':'一問一答・穴埋めを練習します。'} 解答すると自動で履歴が保存されます。</p><button class="btn full" onclick="nextQuestion('${type}')">${all.length?'問題を解く':'最初の問題を解く'} →</button></div><div class="list">${a.map(q=>`<div class="item" onclick="openQuestion('${safe(q.id)}')" style="cursor:pointer"><div class="row"><div><strong>${safe(q.topic)}</strong><br><small>${safe(q.q).slice(0,46)}${q.q.length>46?'…':''}</small></div><span class="pill">${state.review[q.id]?(due(q)?'復習対象':'次回 '+state.review[q.id].next):'未学習'}</span></div></div>`).join('')}</div>`}
function records(){let s=stats(),pct=s.count?Math.round(s.correct/s.count*100):0;let recent=state.history.slice(-12).reverse();return `<h2>学習記録・設定</h2><div class="grid"><div class="stat"><div class="meta">累計解答</div><strong>${s.count}</strong><small>件</small></div><div class="stat"><div class="meta">正答率</div><strong>${pct}%</strong><small>全科目</small></div><div class="stat"><div class="meta">学習済み</div><strong>${s.done}</strong><small>種類</small></div><div class="stat"><div class="meta">学習時間（概算）</div><strong>${Math.floor(state.seconds/60)}分</strong><small>画面表示時間</small></div></div><div class="card" style="margin-top:13px"><h2>最近の解答</h2><div class="list">${recent.length?recent.map(v=>`<div class="row item"><div><strong>${safe(v.topic)}</strong><div class="meta">${new Date(v.date).toLocaleString('ja-JP')}</div></div><span class="pill" style="${v.correct?'':'color:#a44;background:#fff0ef'}">${v.correct?'正解':'不正解'}</span></div>`).join(''):'<div class="muted">まだ解答履歴がありません。</div>'}</div></div><div class="card"><h2>データ管理</h2><p class="meta">学習記録・復習予定・追加問題をJSONとして保存できます。別端末には自動同期されません。</p><div class="stack"><button class="btn secondary" onclick="backup()">バックアップを保存</button><label class="btn secondary" style="cursor:pointer">バックアップから復元<input type="file" accept="application/json,.json" style="display:none" onchange="restore(event)"></label></div><details><summary class="meta">問題追加（JSON・上級者向け）</summary><p class="meta">問題登録機能はこの試作品ではJSONデータ編集方式です。CSV/Excel直接読込は今後の拡張対象です。</p><textarea class="field" id="custom" style="min-height:115px;font-size:12px" placeholder='[{"id":"my1","type":"theory","topic":"自作","mode":"blank","q":"問題文","correctText":"答え","explain":"解説","source":"https://www.nta.go.jp/"}]'></textarea><button class="btn secondary" onclick="importCustom()">問題を追加する</button></details><hr style="border:0;border-top:1px solid #e0e7ef;margin:18px 0"><button class="btn danger" onclick="resetData()">すべての学習記録を削除</button></div>`}
function draw(){el.innerHTML=active?question(active):page==='home'?home():page==='records'?records():listing(page);document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
window.setSel=v=>{selection=v;draw()};window.setText=v=>{selection=v;let b=document.getElementById('submit');if(b)b.disabled=!v.trim()};window.openQuestion=id=>{let q=seed.concat(state.custom).find(v=>v.id===id);if(q){page=q.type;choose(q)}};
window.nextQuestion=type=>{let a=items(type),q=a.find(v=>!state.review[v.id])||a.filter(due).sort((x,y)=>(state.review[x.id]?.last||'').localeCompare(state.review[y.id]?.last||''))[0]||a.sort((x,y)=>(state.review[x.id]?.last||'').localeCompare(state.review[y.id]?.last||''))[0];if(q){page=type;choose(q)}else alert('問題が登録されていません。')};window.startDue=()=>{let q=seed.concat(state.custom).find(due);if(q){page=q.type;choose(q)}else alert('本日の復習対象はありません。')};
window.backup=()=>{state.seconds+=Math.floor((Date.now()-sessionStarted)/1000);sessionStarted=Date.now();persist();let blob=new Blob([JSON.stringify({app:'shohizei-study',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shohizei-study-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.restore=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!=='shohizei-study'||!d.data||!Array.isArray(d.data.history)||!Array.isArray(d.data.custom)||typeof d.data.review!=='object'||d.data.review===null)throw Error('形式が異なります');if(!confirm('現在の学習データをバックアップ内容で置き換えます。よろしいですか？'))return;state=d.data;persist();draw()}catch(e){alert('復元できませんでした：'+e.message)}};
window.importCustom=()=>{try{let a=JSON.parse(document.getElementById('custom').value);if(!Array.isArray(a)||a.length>200||!a.length)throw Error('1～200問の配列にしてください');for(let q of a){if(!q.id||!q.type||!q.q||!q.topic||!q.source||!/^https:\/\//.test(q.source)||!['theory','calc'].includes(q.type)||seed.concat(state.custom).some(x=>x.id===q.id))throw Error('ID重複・必須情報の欠落・URL形式不正があります');if(q.type==='theory'&&!(q.mode==='choice'&&Array.isArray(q.choices)&&Number.isInteger(q.correct)&&q.correct>=0&&q.correct<q.choices.length)&&!(q.mode==='blank'&&typeof q.correctText==='string'))throw Error('理論問題の正答形式が不正です');if(q.type==='calc'&&!Number.isFinite(q.correctNumber))throw Error('計算問題の正答形式が不正です')}state.custom.push(...a);persist();alert(a.length+'問追加しました');draw()}catch(e){alert('追加できませんでした：'+e.message)}};
window.resetData=()=>{if(confirm('すべての学習履歴・追加問題を削除します。取り消せません。よろしいですか？')){state={history:[],review:{},seconds:0,custom:[]};persist();draw()}};
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));document.addEventListener('visibilitychange',()=>{if(document.hidden){state.seconds+=Math.floor((Date.now()-sessionStarted)/1000);persist()}else sessionStarted=Date.now()});window.addEventListener('beforeunload',()=>{state.seconds+=Math.floor((Date.now()-sessionStarted)/1000);persist()});draw();if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script></body></html>
